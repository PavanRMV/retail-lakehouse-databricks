[project]
name = "retail-lakehouse-databricks"
version = "0.1.0"
description = "Production-style Databricks lakehouse for UCI Online Retail"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<2", "pandas>=2.2,<3", "openpyxl>=3.1,<4", "pyyaml>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "sqlglot==30.22.0"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
